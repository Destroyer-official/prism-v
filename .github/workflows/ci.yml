name: Prism-V Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native-core-tests:
    name: Build & Verify C++20 Core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets
        run: cmake --build build --config Release

      - name: Run Native Tests
        run: ctest --test-dir build --output-on-failure -C Release

  java-app-compile:
    name: Compile Standalone Java App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform
        run: sdkmanager "platforms;android-35"

      - name: Compile Java Sources
        run: |
          mkdir -p build/java-check
          find android_app/src -name '*.java' > build/java-sources.txt
          javac --release 17 -encoding UTF-8 \
            -cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            -d build/java-check \
            @build/java-sources.txt
